<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Calendar - ContentMultiplier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/auth.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-indigo-600">ContentMultiplier</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/upload.html" class="text-gray-600 hover:text-gray-900">Upload</a>
                    <a href="/library.html" class="text-gray-600 hover:text-gray-900">Library</a>
                    <a href="/calendar.html" class="text-indigo-600 font-medium">Calendar</a>
                    <a href="/settings.html" class="text-gray-600 hover:text-gray-900">Settings</a>
                    <div id="navbar-user" class="flex items-center"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold">Content Calendar</h1>
                <p class="text-gray-600 mt-1">Plan and schedule your content publishing</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="prevMonth()" class="p-2 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <h2 id="current-month" class="text-xl font-semibold min-w-[200px] text-center">December 2025</h2>
                <button onclick="nextMonth()" class="p-2 hover:bg-gray-100 rounded">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
                <button onclick="goToToday()" class="ml-4 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700">
                    Today
                </button>
            </div>
        </div>

        <div class="grid lg:grid-cols-4 gap-6">
            <!-- Calendar Grid -->
            <div class="lg:col-span-3">
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <!-- Day Headers -->
                    <div class="grid grid-cols-7 border-b">
                        <div class="py-3 text-center text-sm font-medium text-gray-500">Sun</div>
                        <div class="py-3 text-center text-sm font-medium text-gray-500">Mon</div>
                        <div class="py-3 text-center text-sm font-medium text-gray-500">Tue</div>
                        <div class="py-3 text-center text-sm font-medium text-gray-500">Wed</div>
                        <div class="py-3 text-center text-sm font-medium text-gray-500">Thu</div>
                        <div class="py-3 text-center text-sm font-medium text-gray-500">Fri</div>
                        <div class="py-3 text-center text-sm font-medium text-gray-500">Sat</div>
                    </div>
                    <!-- Calendar Days -->
                    <div id="calendar-grid" class="grid grid-cols-7">
                        <!-- Days will be rendered here -->
                    </div>
                </div>
            </div>

            <!-- Sidebar: Unscheduled Content -->
            <div class="space-y-6">
                <!-- Unscheduled Content -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h3 class="font-semibold mb-4">Unscheduled Content</h3>
                    <p class="text-xs text-gray-500 mb-3">Drag to calendar or click to schedule</p>
                    <div id="unscheduled-list" class="space-y-2 max-h-96 overflow-y-auto">
                        <p class="text-gray-500 text-sm">Loading...</p>
                    </div>
                </div>

                <!-- Upcoming -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h3 class="font-semibold mb-4">Upcoming (7 days)</h3>
                    <div id="upcoming-list" class="space-y-2">
                        <p class="text-gray-500 text-sm">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Schedule Modal -->
    <div id="schedule-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="p-6">
                <h3 class="text-lg font-semibold mb-4">Schedule Content</h3>
                <div id="modal-content-preview" class="p-3 bg-gray-50 rounded mb-4 text-sm text-gray-700"></div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Date</label>
                    <input type="date" id="schedule-date"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Notes (optional)</label>
                    <input type="text" id="schedule-notes"
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500"
                        placeholder="e.g., Post at 9am EST">
                </div>
                <div class="flex gap-3">
                    <button onclick="closeModal()" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                        Cancel
                    </button>
                    <button onclick="saveSchedule()" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                        Schedule
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg hidden"></div>

    <script>
        // Require authentication
        if (!Auth.requireAuth()) {
            // Will redirect to login
        }

        let currentDate = new Date();
        let scheduledContent = [];
        let unscheduledContent = [];
        let selectedOutputId = null;

        const typeColors = {
            'linkedin': 'bg-blue-100 border-blue-300 text-blue-800',
            'blog': 'bg-green-100 border-green-300 text-green-800',
            'email': 'bg-purple-100 border-purple-300 text-purple-800',
            'email_sequence': 'bg-orange-100 border-orange-300 text-orange-800',
        };

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update header
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                                'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('current-month').textContent = `${monthNames[month]} ${year}`;

            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date().toISOString().split('T')[0];

            let html = '';

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                html += '<div class="min-h-[100px] border-b border-r bg-gray-50"></div>';
            }

            // Days of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateStr === today;
                const dayContent = scheduledContent.filter(s => s.scheduled_date === dateStr);

                html += `
                    <div class="min-h-[100px] border-b border-r p-1 ${isToday ? 'bg-indigo-50' : ''}"
                         onclick="openScheduleForDate('${dateStr}')"
                         ondragover="event.preventDefault()" ondrop="handleDrop(event, '${dateStr}')">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-sm font-medium ${isToday ? 'bg-indigo-600 text-white w-6 h-6 rounded-full flex items-center justify-center' : 'text-gray-700'}">
                                ${day}
                            </span>
                        </div>
                        <div class="space-y-1">
                            ${dayContent.map(content => `
                                <div class="px-2 py-1 rounded text-xs border cursor-pointer ${typeColors[content.content_type] || 'bg-gray-100 border-gray-300'}"
                                     onclick="event.stopPropagation(); viewScheduled(${content.output_id})"
                                     title="${content.content_preview}">
                                    <div class="font-medium truncate">${content.content_type}</div>
                                    ${content.notes ? `<div class="text-xs opacity-75 truncate">${content.notes}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Fill remaining cells
            const totalCells = firstDay + daysInMonth;
            const remainingCells = 7 - (totalCells % 7);
            if (remainingCells < 7) {
                for (let i = 0; i < remainingCells; i++) {
                    html += '<div class="min-h-[100px] border-b border-r bg-gray-50"></div>';
                }
            }

            grid.innerHTML = html;
        }

        function renderUnscheduled() {
            const container = document.getElementById('unscheduled-list');

            if (unscheduledContent.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">No unscheduled content</p>';
                return;
            }

            container.innerHTML = unscheduledContent.map(content => `
                <div class="p-2 border rounded cursor-pointer hover:bg-gray-50 ${typeColors[content.content_type] || 'border-gray-200'}"
                     draggable="true"
                     ondragstart="handleDragStart(event, ${content.output_id}, '${content.content_preview.replace(/'/g, "\\'")}', '${content.content_type}')"
                     onclick="openScheduleModal(${content.output_id}, '${content.content_preview.replace(/'/g, "\\'")}')">
                    <div class="text-xs font-medium">${content.content_type}</div>
                    <div class="text-xs text-gray-600 truncate">${content.content_preview}</div>
                </div>
            `).join('');
        }

        function renderUpcoming() {
            const container = document.getElementById('upcoming-list');

            const upcoming = scheduledContent
                .filter(s => s.scheduled_date >= new Date().toISOString().split('T')[0])
                .sort((a, b) => a.scheduled_date.localeCompare(b.scheduled_date))
                .slice(0, 5);

            if (upcoming.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">Nothing scheduled</p>';
                return;
            }

            container.innerHTML = upcoming.map(content => `
                <div class="p-2 border rounded ${typeColors[content.content_type] || 'border-gray-200'}">
                    <div class="flex justify-between items-start">
                        <div class="text-xs font-medium">${content.content_type}</div>
                        <div class="text-xs text-gray-500">${formatDate(content.scheduled_date)}</div>
                    </div>
                    <div class="text-xs text-gray-600 truncate mt-1">${content.content_preview}</div>
                </div>
            `).join('');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        async function loadCalendarData() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const startDate = `${year}-${String(month + 1).padStart(2, '0')}-01`;
            const endDate = `${year}-${String(month + 2).padStart(2, '0')}-01`;

            try {
                const response = await Auth.fetchWithAuth(`/api/calendar?start_date=${startDate}&end_date=${endDate}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to load calendar');
                }

                scheduledContent = data.scheduled || [];
                unscheduledContent = data.unscheduled || [];

                renderCalendar();
                renderUnscheduled();
                renderUpcoming();

            } catch (err) {
                console.error('Failed to load calendar:', err);
                showToast('Failed to load calendar: ' + err.message);
            }
        }

        function prevMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            loadCalendarData();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            loadCalendarData();
        }

        function goToToday() {
            currentDate = new Date();
            loadCalendarData();
        }

        // Drag and drop
        function handleDragStart(event, outputId, preview, contentType) {
            event.dataTransfer.setData('outputId', outputId);
            event.dataTransfer.setData('preview', preview);
            event.dataTransfer.setData('contentType', contentType);
        }

        function handleDrop(event, dateStr) {
            event.preventDefault();
            const outputId = event.dataTransfer.getData('outputId');
            const preview = event.dataTransfer.getData('preview');

            if (outputId) {
                selectedOutputId = parseInt(outputId);
                document.getElementById('modal-content-preview').textContent = preview;
                document.getElementById('schedule-date').value = dateStr;
                document.getElementById('schedule-notes').value = '';
                document.getElementById('schedule-modal').classList.remove('hidden');
            }
        }

        function openScheduleModal(outputId, preview) {
            selectedOutputId = outputId;
            document.getElementById('modal-content-preview').textContent = preview;
            document.getElementById('schedule-date').value = '';
            document.getElementById('schedule-notes').value = '';
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function openScheduleForDate(dateStr) {
            // Only if there's unscheduled content
            if (unscheduledContent.length > 0) {
                showToast('Drag content from the sidebar or click on unscheduled content');
            }
        }

        function closeModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
            selectedOutputId = null;
        }

        async function saveSchedule() {
            const date = document.getElementById('schedule-date').value;
            const notes = document.getElementById('schedule-notes').value;

            if (!date) {
                showToast('Please select a date');
                return;
            }

            try {
                const response = await Auth.fetchWithAuth('/api/calendar/schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        output_id: selectedOutputId,
                        scheduled_date: date,
                        notes: notes || null
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to schedule');
                }

                closeModal();
                showToast('Content scheduled!');
                loadCalendarData();

            } catch (err) {
                showToast('Error: ' + err.message);
            }
        }

        function viewScheduled(outputId) {
            window.location.href = `/results.html?output_id=${outputId}`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Load on page load
        loadCalendarData();
    </script>
</body>
</html>
