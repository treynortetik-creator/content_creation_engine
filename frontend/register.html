<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ContentMultiplier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <a href="/" class="text-3xl font-bold text-indigo-600">ContentMultiplier</a>
            <p class="text-gray-600 mt-2">Create your account</p>
        </div>

        <!-- Register Form -->
        <div class="bg-white rounded-lg shadow-sm p-8">
            <form id="register-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                        Email address
                    </label>
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="you@example.com">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                        Password
                    </label>
                    <input type="password" id="password" name="password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="At least 8 characters">
                    <p class="mt-1 text-xs text-gray-500">
                        Must be 8+ characters with uppercase, lowercase, and number
                    </p>
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-1">
                        Confirm Password
                    </label>
                    <input type="password" id="confirm-password" name="confirm_password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                        placeholder="Confirm your password">
                </div>

                <!-- Password strength indicator -->
                <div id="password-strength" class="hidden">
                    <div class="flex gap-1 mb-1">
                        <div class="h-1 flex-1 rounded bg-gray-200" id="strength-1"></div>
                        <div class="h-1 flex-1 rounded bg-gray-200" id="strength-2"></div>
                        <div class="h-1 flex-1 rounded bg-gray-200" id="strength-3"></div>
                        <div class="h-1 flex-1 rounded bg-gray-200" id="strength-4"></div>
                    </div>
                    <p class="text-xs text-gray-500" id="strength-text"></p>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-red-600 text-sm">
                </div>

                <button type="submit" id="submit-btn"
                    class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Create account
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-600">
                Already have an account?
                <a href="/login.html" class="text-indigo-600 hover:underline font-medium">
                    Sign in
                </a>
            </div>
        </div>

        <!-- Back to home -->
        <div class="text-center mt-6">
            <a href="/" class="text-gray-500 hover:text-gray-700 text-sm">
                &larr; Back to home
            </a>
        </div>
    </div>

    <script>
        // Password strength checker
        document.getElementById('password').addEventListener('input', (e) => {
            const password = e.target.value;
            const strengthDiv = document.getElementById('password-strength');
            const strengthText = document.getElementById('strength-text');

            if (password.length === 0) {
                strengthDiv.classList.add('hidden');
                return;
            }

            strengthDiv.classList.remove('hidden');

            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;

            const colors = ['bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-green-500'];
            const texts = ['Weak', 'Fair', 'Good', 'Strong'];

            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById(`strength-${i}`);
                bar.className = `h-1 flex-1 rounded ${i <= strength ? colors[strength - 1] : 'bg-gray-200'}`;
            }

            strengthText.textContent = strength > 0 ? texts[strength - 1] : '';
        });

        // Check if already logged in
        const token = localStorage.getItem('auth_token');
        if (token) {
            fetch('/api/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(res => {
                if (res.ok) {
                    window.location.href = '/upload.html';
                }
            });
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Client-side validation
            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = 'Password must be at least 8 characters';
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store token and user info
                    localStorage.setItem('auth_token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect to brand voice setup (onboarding)
                    window.location.href = '/brand-voice.html?onboarding=true';
                } else {
                    throw new Error(data.detail || 'Registration failed');
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create account';
            }
        });
    </script>
</body>
</html>
