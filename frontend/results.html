<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - ContentMultiplier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/auth.js"></script>
    <style>
        /* Device Preview Styles */
        .desktop-preview .post-preview-content {
            max-width: 550px;
            font-size: 14px;
            line-height: 1.5;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
        }

        .mobile-preview .post-preview-content {
            max-width: 350px;
            font-size: 13px;
            line-height: 1.4;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 12px;
        }

        .preview-btn.active {
            background-color: #4f46e5;
            color: white;
        }

        .preview-btn:not(.active) {
            background-color: #f3f4f6;
            color: #4b5563;
        }

        /* LinkedIn-like styling */
        .linkedin-frame {
            background: #f3f2ef;
            padding: 12px;
            border-radius: 8px;
        }

        .linkedin-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .linkedin-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .linkedin-name {
            font-weight: 600;
            font-size: 14px;
            color: #000;
        }

        .linkedin-title {
            font-size: 12px;
            color: #666;
        }

        /* Email Sequence Styles */
        .email-header-green { background: linear-gradient(to right, #dcfce7, white); }
        .email-header-blue { background: linear-gradient(to right, #dbeafe, white); }
        .email-header-purple { background: linear-gradient(to right, #f3e8ff, white); }
        .email-header-orange { background: linear-gradient(to right, #ffedd5, white); }
        .email-header-teal { background: linear-gradient(to right, #ccfbf1, white); }
        .email-header-gray { background: linear-gradient(to right, #f3f4f6, white); }

        .email-badge-green { background-color: #dcfce7; color: #15803d; }
        .email-badge-blue { background-color: #dbeafe; color: #1d4ed8; }
        .email-badge-purple { background-color: #f3e8ff; color: #7c3aed; }
        .email-badge-orange { background-color: #ffedd5; color: #c2410c; }
        .email-badge-teal { background-color: #ccfbf1; color: #0d9488; }
        .email-badge-gray { background-color: #f3f4f6; color: #4b5563; }

        .email-number-green { background-color: #dcfce7; color: #15803d; }
        .email-number-blue { background-color: #dbeafe; color: #1d4ed8; }
        .email-number-purple { background-color: #f3e8ff; color: #7c3aed; }
        .email-number-orange { background-color: #ffedd5; color: #c2410c; }
        .email-number-teal { background-color: #ccfbf1; color: #0d9488; }
        .email-number-gray { background-color: #f3f4f6; color: #4b5563; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-bold text-indigo-600">ContentMultiplier</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/upload.html" class="text-gray-600 hover:text-gray-900">Upload</a>
                    <a href="/library.html" class="text-gray-600 hover:text-gray-900">Library</a>
                    <div id="navbar-user" class="flex items-center"></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold" id="job-title">Results</h1>
                <p class="text-gray-600 mt-1" id="job-meta">Loading...</p>
            </div>
            <div class="flex gap-4 items-center">
                <!-- Export Dropdown -->
                <div class="relative" id="export-dropdown">
                    <button onclick="toggleExportMenu()" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 px-3 py-2 border rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Export
                    </button>
                    <div id="export-menu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border z-10">
                        <div class="py-2">
                            <button onclick="exportAs('markdown')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                Download Markdown (.md)
                            </button>
                            <button onclick="exportAs('json')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                Download JSON (.json)
                            </button>
                            <button onclick="exportAs('docx')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                Download Word (.docx)
                            </button>
                            <div class="border-t my-1"></div>
                            <button onclick="exportAs('zip')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 font-medium">
                                Download All (.zip)
                            </button>
                        </div>
                    </div>
                </div>
                <a href="/library.html" class="text-indigo-600 hover:underline">View in Library</a>
                <a href="/upload.html" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">
                    New Upload
                </a>
            </div>
        </div>

        <!-- Tabs -->
        <div class="mb-6 border-b">
            <div class="flex space-x-8">
                <button class="tab-btn px-1 pb-4 border-b-2 border-indigo-600 text-indigo-600 font-medium" data-tab="outputs">
                    Generated Content
                </button>
                <button class="tab-btn px-1 pb-4 border-b-2 border-transparent text-gray-500 hover:text-gray-700" data-tab="atoms">
                    Extracted Atoms
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="animate-spin h-8 w-8 border-4 border-indigo-600 border-t-transparent rounded-full mx-auto"></div>
            <p class="mt-4 text-gray-600">Loading results...</p>
        </div>

        <!-- Outputs Tab -->
        <div id="outputs-tab" class="hidden">
            <div id="outputs-container" class="space-y-6"></div>
        </div>

        <!-- Atoms Tab -->
        <div id="atoms-tab" class="hidden">
            <div class="mb-4 flex gap-2">
                <button class="atom-filter px-3 py-1 rounded-full bg-gray-200 text-gray-700 text-sm" data-type="all">All</button>
                <button class="atom-filter px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-sm" data-type="data">Data</button>
                <button class="atom-filter px-3 py-1 rounded-full bg-green-100 text-green-700 text-sm" data-type="story">Stories</button>
                <button class="atom-filter px-3 py-1 rounded-full bg-purple-100 text-purple-700 text-sm" data-type="insight">Insights</button>
                <button class="atom-filter px-3 py-1 rounded-full bg-red-100 text-red-700 text-sm" data-type="problem">Problems</button>
                <button class="atom-filter px-3 py-1 rounded-full bg-yellow-100 text-yellow-700 text-sm" data-type="solution">Solutions</button>
            </div>
            <div id="atoms-container" class="grid md:grid-cols-2 gap-4"></div>
        </div>

        <!-- Cost Info -->
        <div class="mt-8 p-4 bg-gray-100 rounded-lg">
            <div class="flex justify-between items-center">
                <span class="text-gray-600">Processing Cost:</span>
                <span class="font-semibold" id="total-cost">$0.00</span>
            </div>
        </div>
    </div>

    <!-- Copy Toast -->
    <div id="copy-toast" class="fixed bottom-4 right-4 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg hidden">
        Copied to clipboard!
    </div>

    <script>
        // Require authentication
        if (!Auth.requireAuth()) {
            // Will redirect to login
        }

        const jobId = new URLSearchParams(window.location.search).get('job_id');

        if (!jobId) {
            window.location.href = '/upload.html';
        }

        // Export functions
        function toggleExportMenu() {
            const menu = document.getElementById('export-menu');
            menu.classList.toggle('hidden');
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('export-dropdown');
            const menu = document.getElementById('export-menu');
            if (dropdown && !dropdown.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        async function exportAs(format) {
            try {
                const url = `/api/export/${jobId}/${format}`;
                const response = await Auth.fetchWithAuth(url);

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || 'Export failed');
                }

                // Get filename from Content-Disposition header
                const disposition = response.headers.get('Content-Disposition');
                let filename = `content.${format}`;
                if (disposition) {
                    const match = disposition.match(/filename="(.+)"/);
                    if (match) filename = match[1];
                }

                // Download the file
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                a.remove();

                showToast(`Downloaded ${filename}`);
                document.getElementById('export-menu').classList.add('hidden');
            } catch (err) {
                console.error('Export error:', err);
                alert('Export failed: ' + err.message);
            }
        }

        let currentTab = 'outputs';
        let allAtoms = [];

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                currentTab = tab;

                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('border-indigo-600', 'text-indigo-600');
                    b.classList.add('border-transparent', 'text-gray-500');
                });
                btn.classList.remove('border-transparent', 'text-gray-500');
                btn.classList.add('border-indigo-600', 'text-indigo-600');

                document.getElementById('outputs-tab').classList.toggle('hidden', tab !== 'outputs');
                document.getElementById('atoms-tab').classList.toggle('hidden', tab !== 'atoms');
            });
        });

        // Atom filtering
        document.querySelectorAll('.atom-filter').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                filterAtoms(type);

                document.querySelectorAll('.atom-filter').forEach(b => {
                    b.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-500');
                });
                btn.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-500');
            });
        });

        function filterAtoms(type) {
            const container = document.getElementById('atoms-container');
            const atoms = type === 'all' ? allAtoms : allAtoms.filter(a => a.type === type);
            renderAtoms(atoms);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById('copy-toast');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 2000);
        }

        async function saveToSwipeFile(outputId, contentType, content, sourceTitle) {
            try {
                const response = await Auth.fetchWithAuth('/api/swipe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        output_id: outputId,
                        content_type: contentType,
                        content: content,
                        source_title: sourceTitle || document.getElementById('job-title').textContent,
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const toast = document.getElementById('copy-toast');
                    toast.textContent = `Saved to swipe file! (${data.patterns_found} patterns learned)`;
                    toast.classList.remove('hidden');
                    setTimeout(() => {
                        toast.classList.add('hidden');
                        toast.textContent = 'Copied to clipboard!';
                    }, 3000);
                } else {
                    alert('Failed to save: ' + (data.detail || 'Unknown error'));
                }
            } catch (err) {
                console.error('Failed to save to swipe file:', err);
                alert('Failed to save to swipe file');
            }
        }

        // Feedback state tracking
        const feedbackState = {};

        async function submitFeedback(outputId, feedbackType) {
            try {
                const currentFeedback = feedbackState[outputId];

                // If clicking same button, remove feedback
                if (currentFeedback === feedbackType) {
                    await Auth.fetchWithAuth(`/api/feedback/${outputId}`, { method: 'DELETE' });
                    feedbackState[outputId] = null;
                    updateFeedbackUI(outputId, null);
                    showToast('Feedback removed');
                    return;
                }

                // Submit new feedback
                const response = await Auth.fetchWithAuth('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        output_id: outputId,
                        feedback_type: feedbackType,
                    })
                });

                if (response.ok) {
                    feedbackState[outputId] = feedbackType;
                    updateFeedbackUI(outputId, feedbackType);
                    showToast(feedbackType === 'up' ? 'Thanks for the feedback!' : 'We\'ll do better next time');
                }
            } catch (err) {
                console.error('Feedback error:', err);
            }
        }

        function updateFeedbackUI(outputId, feedbackType) {
            const upBtn = document.getElementById(`feedback-up-${outputId}`);
            const downBtn = document.getElementById(`feedback-down-${outputId}`);

            if (!upBtn || !downBtn) return;

            // Reset both buttons
            upBtn.classList.remove('bg-green-100', 'text-green-700');
            upBtn.classList.add('text-gray-400', 'hover:text-green-600');
            downBtn.classList.remove('bg-red-100', 'text-red-700');
            downBtn.classList.add('text-gray-400', 'hover:text-red-600');

            // Highlight selected
            if (feedbackType === 'up') {
                upBtn.classList.remove('text-gray-400', 'hover:text-green-600');
                upBtn.classList.add('bg-green-100', 'text-green-700');
            } else if (feedbackType === 'down') {
                downBtn.classList.remove('text-gray-400', 'hover:text-red-600');
                downBtn.classList.add('bg-red-100', 'text-red-700');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('copy-toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.textContent = 'Copied to clipboard!';
            }, 2000);
        }

        function renderFeedbackButtons(outputId) {
            return `
                <div class="flex items-center gap-1 ml-2">
                    <button onclick="submitFeedback(${outputId}, 'up')" id="feedback-up-${outputId}"
                        class="p-1.5 rounded-full transition text-gray-400 hover:text-green-600" title="This is great">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path>
                        </svg>
                    </button>
                    <button onclick="submitFeedback(${outputId}, 'down')" id="feedback-down-${outputId}"
                        class="p-1.5 rounded-full transition text-gray-400 hover:text-red-600" title="Needs improvement">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14H5.236a2 2 0 01-1.789-2.894l3.5-7A2 2 0 018.736 3h4.018a2 2 0 01.485.06l3.76.94m-7 10v5a2 2 0 002 2h.096c.5 0 .905-.405.905-.904 0-.715.211-1.413.608-2.008L17 13V4m-7 10h2m5-10h2a2 2 0 012 2v6a2 2 0 01-2 2h-2.5"></path>
                        </svg>
                    </button>
                </div>
            `;
        }

        function getTypeColor(type) {
            const colors = {
                'data': 'blue',
                'story': 'green',
                'insight': 'purple',
                'problem': 'red',
                'solution': 'yellow'
            };
            return colors[type] || 'gray';
        }

        function getScoreColor(score) {
            if (score >= 85) return { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-500' };
            if (score >= 70) return { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-500' };
            if (score >= 50) return { bg: 'bg-yellow-100', text: 'text-yellow-700', border: 'border-yellow-500' };
            return { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-500' };
        }

        function renderScoreBadge(scores) {
            if (!scores || !scores.overall_score) return '';

            const overall = scores.overall_score;
            const colors = getScoreColor(overall);

            return `
                <div class="relative group">
                    <span class="px-2 py-1 rounded text-sm font-medium ${colors.bg} ${colors.text}">
                        Quality: ${overall}/100
                    </span>
                    <div class="absolute z-10 invisible group-hover:visible bg-white border shadow-lg rounded-lg p-4 w-64 -left-20 top-8">
                        <div class="text-sm font-semibold mb-2 text-gray-800">Quality Breakdown</div>
                        <div class="space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span class="text-gray-600">Hook Quality</span>
                                <span class="font-medium">${scores.hook_quality?.score || 'N/A'}</span>
                            </div>
                            <div class="text-xs text-gray-500 -mt-1">${scores.hook_quality?.reason || ''}</div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Brand Alignment</span>
                                <span class="font-medium">${scores.brand_alignment?.score || 'N/A'}</span>
                            </div>
                            <div class="text-xs text-gray-500 -mt-1">${scores.brand_alignment?.reason || ''}</div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Clarity</span>
                                <span class="font-medium">${scores.clarity?.score || 'N/A'}</span>
                            </div>
                            <div class="text-xs text-gray-500 -mt-1">${scores.clarity?.reason || ''}</div>
                            <div class="flex justify-between">
                                <span class="text-gray-600">Engagement</span>
                                <span class="font-medium">${scores.engagement_potential?.score || 'N/A'}</span>
                            </div>
                            <div class="text-xs text-gray-500 -mt-1">${scores.engagement_potential?.reason || ''}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Track selected hooks for each output
        let selectedHooks = {};

        function selectHook(outputId, hookIndex) {
            selectedHooks[outputId] = hookIndex;

            // Update radio buttons
            document.querySelectorAll(`input[name="hook-${outputId}"]`).forEach((radio, idx) => {
                radio.checked = idx === hookIndex;
            });

            // Update hook option styling
            document.querySelectorAll(`#hook-options-${outputId} .hook-option`).forEach((option, idx) => {
                if (idx === hookIndex) {
                    option.classList.add('border-blue-500', 'bg-blue-50');
                    option.classList.remove('border-gray-200');
                } else {
                    option.classList.remove('border-blue-500', 'bg-blue-50');
                    option.classList.add('border-gray-200');
                }
            });

            // Update preview content
            const previewEl = document.getElementById(`preview-${outputId}`);
            const hookData = window.hookVariationsData[outputId];
            if (previewEl && hookData && hookData.full_variations) {
                previewEl.textContent = hookData.full_variations[hookIndex] || '';
            }
        }

        function copySelectedHook(outputId) {
            const hookData = window.hookVariationsData[outputId];
            const selectedIndex = selectedHooks[outputId] || 0;
            const content = hookData?.full_variations?.[selectedIndex] || '';
            copyToClipboard(content);
        }

        function setPreviewDevice(outputId, device) {
            const container = document.getElementById(`preview-container-${outputId}`);
            if (!container) return;

            // Update container class
            container.classList.remove('desktop-preview', 'mobile-preview');
            container.classList.add(`${device}-preview`);

            // Update button states
            const desktopBtn = document.getElementById(`desktop-btn-${outputId}`);
            const mobileBtn = document.getElementById(`mobile-btn-${outputId}`);

            if (desktopBtn && mobileBtn) {
                if (device === 'desktop') {
                    desktopBtn.classList.add('active');
                    mobileBtn.classList.remove('active');
                } else {
                    mobileBtn.classList.add('active');
                    desktopBtn.classList.remove('active');
                }
            }
        }

        // Store hook variations data globally
        window.hookVariationsData = {};

        function renderHookSelector(output, outputId) {
            const hookVariations = output.hook_variations;
            if (!hookVariations || !hookVariations.hooks || hookVariations.hooks.length <= 1) {
                return '';
            }

            // Store for later use
            window.hookVariationsData[outputId] = hookVariations;
            selectedHooks[outputId] = 0;

            const hookTypes = ['Original', 'Question', 'Stat/Data', 'Story', 'Bold Claim'];

            return `
                <div class="mb-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                    <div class="flex items-center justify-between mb-3">
                        <label class="font-semibold text-blue-800">Choose Your Hook:</label>
                        <span class="text-xs text-blue-600">5 variations available</span>
                    </div>
                    <div class="space-y-2" id="hook-options-${outputId}">
                        ${hookVariations.hooks.map((hook, idx) => `
                            <div class="hook-option p-3 border-2 rounded-lg cursor-pointer transition-colors ${idx === 0 ? 'border-blue-500 bg-blue-50' : 'border-gray-200 bg-white hover:border-blue-300'}"
                                 onclick="selectHook('${outputId}', ${idx})">
                                <div class="flex items-start gap-3">
                                    <input type="radio" name="hook-${outputId}" value="${idx}" ${idx === 0 ? 'checked' : ''} class="mt-1">
                                    <div class="flex-1">
                                        <span class="text-xs font-medium text-gray-500 uppercase">${hookTypes[idx] || 'Variation ' + (idx + 1)}</span>
                                        <p class="text-sm text-gray-800 mt-1">${escapeHtml(hook)}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="mt-4 pt-4 border-t border-blue-200">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex items-center gap-4">
                                <span class="text-sm font-medium text-blue-800">Full Post Preview:</span>
                                <div class="flex gap-2">
                                    <button onclick="setPreviewDevice('${outputId}', 'desktop')"
                                        class="preview-btn active px-3 py-1 rounded text-xs font-medium transition"
                                        id="desktop-btn-${outputId}">
                                        Desktop
                                    </button>
                                    <button onclick="setPreviewDevice('${outputId}', 'mobile')"
                                        class="preview-btn px-3 py-1 rounded text-xs font-medium transition"
                                        id="mobile-btn-${outputId}">
                                        Mobile
                                    </button>
                                </div>
                            </div>
                            <button onclick="copySelectedHook('${outputId}')"
                                class="text-sm bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 transition">
                                Copy Selected
                            </button>
                        </div>
                        <div id="preview-container-${outputId}" class="linkedin-frame desktop-preview">
                            <div class="linkedin-header">
                                <div class="linkedin-avatar">Y</div>
                                <div>
                                    <div class="linkedin-name">Your Name</div>
                                    <div class="linkedin-title">Your Title | Company</div>
                                </div>
                            </div>
                            <div class="post-preview-content">
                                <pre id="preview-${outputId}" class="whitespace-pre-wrap text-gray-800 font-sans">${escapeHtml(hookVariations.full_variations?.[0] || '')}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Store email sequence data for "Copy All" functionality
        window.emailSequenceData = {};

        function renderEmailSequenceItem(output, index) {
            // Email sequence specific rendering
            const emailTypes = {
                'immediate_value': { label: 'Immediate Value', color: 'green' },
                'deep_dive': { label: 'Deep Dive', color: 'blue' },
                'social_proof': { label: 'Social Proof', color: 'purple' },
                'urgency': { label: 'Urgency', color: 'orange' },
                'nurture': { label: 'Nurture', color: 'teal' }
            };

            const emailType = emailTypes[output.email_type] || { label: output.email_type || `Email ${index + 1}`, color: 'gray' };
            const sendDay = output.send_day !== undefined ? output.send_day : (index * 7);
            const subjectLine = output.subject_line || '';
            const previewText = output.preview_text || '';
            const body = output.body || output.step3_final || output.step2_edited || output.step1_draft || '';
            const ctaText = output.cta_text || '';
            const ctaUrl = output.cta_url_placeholder || '#';

            // Build the full email content for copying
            const fullEmailContent = `Subject: ${subjectLine}\n\n${body}${ctaText ? `\n\n[${ctaText}]` : ''}`;

            // Store for "Copy All" functionality
            if (!window.emailSequenceData.emails) {
                window.emailSequenceData.emails = [];
            }
            window.emailSequenceData.emails[index] = {
                day: sendDay,
                type: emailType.label,
                subject: subjectLine,
                body: body,
                cta: ctaText,
                full: fullEmailContent
            };

            return `
                <div class="border border-gray-200 rounded-lg overflow-hidden mb-4">
                    <!-- Email Header -->
                    <div class="email-header-${emailType.color} px-4 py-3 border-b border-gray-200">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="inline-flex items-center justify-center w-10 h-10 rounded-full email-number-${emailType.color} font-bold text-sm">
                                    ${index + 1}
                                </span>
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="font-semibold text-gray-800">${emailType.label}</span>
                                        <span class="text-xs px-2 py-0.5 rounded-full email-badge-${emailType.color}">
                                            Day ${sendDay}
                                        </span>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-0.5">
                                        ${sendDay === 0 ? 'Sent immediately after event' :
                                          sendDay === 3 ? 'Deep dive on key insight' :
                                          sendDay === 7 ? 'Social proof & results' :
                                          sendDay === 14 ? 'Create urgency' :
                                          sendDay === 30 ? 'Nurture & stay connected' : `Sent on day ${sendDay}`}
                                    </p>
                                </div>
                            </div>
                            <button onclick="copyToClipboard(\`${fullEmailContent.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)"
                                class="text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded text-sm font-medium transition">
                                Copy Email
                            </button>
                        </div>
                    </div>

                    <!-- Email Content -->
                    <div class="p-4 space-y-4">
                        <!-- Subject Line -->
                        <div class="bg-gray-50 rounded-lg p-3">
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Subject Line</label>
                            <div class="flex items-center justify-between mt-1">
                                <p class="text-gray-800 font-medium">${escapeHtml(subjectLine)}</p>
                                <button onclick="copyToClipboard(\`${subjectLine.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)"
                                    class="text-xs text-gray-500 hover:text-indigo-600">
                                    Copy
                                </button>
                            </div>
                        </div>

                        ${previewText ? `
                        <!-- Preview Text -->
                        <div class="bg-gray-50 rounded-lg p-3">
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Preview Text</label>
                            <p class="text-gray-600 text-sm mt-1 italic">${escapeHtml(previewText)}</p>
                        </div>
                        ` : ''}

                        <!-- Body -->
                        <div>
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Email Body</label>
                            <div class="mt-2 prose prose-sm max-w-none">
                                <div class="whitespace-pre-wrap text-gray-700 leading-relaxed">${escapeHtml(body)}</div>
                            </div>
                        </div>

                        ${ctaText ? `
                        <!-- CTA Button -->
                        <div class="pt-2">
                            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Call to Action</label>
                            <div class="mt-2">
                                <span class="inline-block bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium text-sm">
                                    ${escapeHtml(ctaText)}
                                </span>
                                <span class="text-xs text-gray-400 ml-2">${escapeHtml(ctaUrl)}</span>
                            </div>
                        </div>
                        ` : ''}

                        ${output.atoms_used && output.atoms_used.length ? `
                        <!-- Atoms Used -->
                        <details class="pt-2">
                            <summary class="text-xs text-gray-500 cursor-pointer hover:text-gray-700">
                                View atoms used (${output.atoms_used.length})
                            </summary>
                            <div class="mt-2 flex flex-wrap gap-2">
                                ${output.atoms_used.map(atom => `
                                    <span class="text-xs px-2 py-1 bg-gray-100 text-gray-600 rounded">${escapeHtml(atom)}</span>
                                `).join('')}
                            </div>
                        </details>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function copyAllEmails() {
            if (!window.emailSequenceData.emails || window.emailSequenceData.emails.length === 0) {
                return;
            }

            const allEmailsText = window.emailSequenceData.emails
                .filter(e => e)
                .map((email, idx) => {
                    return `${'='.repeat(50)}\nEMAIL ${idx + 1}: ${email.type} (Day ${email.day})\n${'='.repeat(50)}\n\n${email.full}`;
                })
                .join('\n\n\n');

            copyToClipboard(allEmailsText);
        }

        function renderOutputs(outputs) {
            const container = document.getElementById('outputs-container');
            container.innerHTML = '';

            // Sort outputs by quality score (highest first)
            outputs.sort((a, b) => {
                const scoreA = a.quality_scores?.overall_score || 0;
                const scoreB = b.quality_scores?.overall_score || 0;
                return scoreB - scoreA;
            });

            // Group by content type
            const grouped = {};
            outputs.forEach(output => {
                const type = output.content_type;
                if (!grouped[type]) grouped[type] = [];
                grouped[type].push(output);
            });

            for (const [type, items] of Object.entries(grouped)) {
                const section = document.createElement('div');
                section.className = 'bg-white rounded-lg shadow-sm overflow-hidden';

                // Custom titles for content types
                const typeTitles = {
                    'linkedin': 'LinkedIn',
                    'blog': 'Blog',
                    'email': 'Email',
                    'email_sequence': 'Email Sequence (5 emails)'
                };
                const typeTitle = typeTitles[type] || type.charAt(0).toUpperCase() + type.slice(1);

                // Add "Copy All Emails" button for email sequences
                const emailSequenceActions = type === 'email_sequence' ? `
                    <button onclick="copyAllEmails()"
                        class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
                        Copy All Emails
                    </button>
                ` : '';

                section.innerHTML = `
                    <div class="bg-gray-50 px-6 py-4 border-b flex justify-between items-center">
                        <h2 class="text-lg font-semibold">${typeTitle} (${items.length})</h2>
                        ${emailSequenceActions}
                    </div>
                    <div class="${type === 'email_sequence' ? 'p-4 space-y-4' : 'divide-y'}" id="outputs-${type}"></div>
                `;

                container.appendChild(section);

                const outputsDiv = section.querySelector(`#outputs-${type}`);

                items.forEach((output, index) => {
                    const item = document.createElement('div');
                    item.className = 'p-6';

                    const outputId = `${type}-${output.variation_number || index + 1}`;
                    const content = output.step3_final || output.step2_edited || output.step1_draft || '';
                    const hasWarnings = output.warnings && output.warnings.length > 0;
                    const hasHookVariations = output.hook_variations && output.hook_variations.hooks && output.hook_variations.hooks.length > 1;

                    // Special rendering for email sequence
                    if (type === 'email_sequence') {
                        item.innerHTML = renderEmailSequenceItem(output, index);
                        outputsDiv.appendChild(item);
                        return;
                    }

                    item.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-medium text-gray-500">Variation ${output.variation_number || index + 1}</span>
                                ${renderScoreBadge(output.quality_scores)}
                                ${hasWarnings ? '<span class="text-xs px-2 py-1 bg-yellow-100 text-yellow-700 rounded">Has Warnings</span>' : ''}
                                ${hasHookVariations ? '<span class="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded">5 Hook Options</span>' : ''}
                            </div>
                            <div class="flex items-center gap-3">
                                ${!hasHookVariations ? `
                                    <button onclick="copyToClipboard(\`${content.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)"
                                        class="text-indigo-600 hover:underline text-sm">
                                        Copy
                                    </button>
                                ` : ''}
                                <button onclick="saveToSwipeFile(${output.id}, '${type}', \`${content.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)"
                                    class="text-green-600 hover:underline text-sm flex items-center gap-1">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                    </svg>
                                    Save
                                </button>
                                ${renderFeedbackButtons(output.id)}
                            </div>
                        </div>

                        ${hasHookVariations ? renderHookSelector(output, outputId) : `
                            <div class="prose max-w-none">
                                <div class="whitespace-pre-wrap text-gray-700">${escapeHtml(content)}</div>
                            </div>
                        `}

                        ${hasWarnings ? `
                            <div class="mt-4 p-3 bg-yellow-50 rounded text-sm">
                                <strong class="text-yellow-700">Warnings:</strong>
                                <ul class="mt-1 list-disc list-inside text-yellow-600">
                                    ${output.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}

                        <!-- Version Toggle -->
                        <details class="mt-4">
                            <summary class="text-sm text-gray-500 cursor-pointer hover:text-gray-700">
                                View all versions
                            </summary>
                            <div class="mt-2 space-y-2 text-sm">
                                ${output.step1_draft ? `
                                    <div class="p-3 bg-gray-50 rounded">
                                        <strong>Step 1 (Draft):</strong>
                                        <p class="mt-1 whitespace-pre-wrap">${escapeHtml(output.step1_draft.substring(0, 300))}...</p>
                                    </div>
                                ` : ''}
                                ${output.step2_edited ? `
                                    <div class="p-3 bg-gray-50 rounded">
                                        <strong>Step 2 (Edited):</strong>
                                        <p class="mt-1 whitespace-pre-wrap">${escapeHtml(output.step2_edited.substring(0, 300))}...</p>
                                    </div>
                                ` : ''}
                            </div>
                        </details>
                    `;

                    outputsDiv.appendChild(item);
                });
            }
        }

        function renderAtoms(atoms) {
            const container = document.getElementById('atoms-container');
            container.innerHTML = '';

            atoms.forEach(atom => {
                const color = getTypeColor(atom.type);
                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-lg shadow-sm border-l-4 border-${color}-500`;

                const relevance = atom.persona_relevance ? Object.values(atom.persona_relevance)[0] : null;

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-semibold text-${color}-600 uppercase">${atom.type}</span>
                        ${relevance ? `<span class="text-xs text-gray-500">Relevance: ${relevance}/5</span>` : ''}
                    </div>
                    <p class="text-gray-700 text-sm">${escapeHtml(atom.content)}</p>
                    ${atom.source_location ? `<p class="text-xs text-gray-400 mt-2">Source: ${escapeHtml(atom.source_location)}</p>` : ''}
                    <div class="mt-3 flex gap-2">
                        ${atom.tags && atom.tags.length ? atom.tags.map(tag =>
                            `<span class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded">${escapeHtml(tag)}</span>`
                        ).join('') : ''}
                    </div>
                    <button onclick="copyToClipboard(\`${atom.content.replace(/`/g, '\\`').replace(/\$/g, '\\$')}\`)"
                        class="mt-3 text-xs text-indigo-600 hover:underline">
                        Copy
                    </button>
                `;

                container.appendChild(card);
            });

            if (atoms.length === 0) {
                container.innerHTML = '<p class="text-gray-500 col-span-2 text-center py-8">No atoms found</p>';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadResults() {
            try {
                const response = await Auth.fetchWithAuth(`/api/job/${jobId}/results`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Failed to load results');
                }

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('outputs-tab').classList.remove('hidden');

                // Update header
                document.getElementById('job-title').textContent = data.original_filename || 'Results';
                document.getElementById('job-meta').textContent =
                    `${data.outputs.length} outputs generated | ${data.atoms.length} atoms extracted`;
                document.getElementById('total-cost').textContent = `$${data.cost_incurred.toFixed(4)}`;

                // Render outputs
                renderOutputs(data.outputs);

                // Store atoms and render
                allAtoms = data.atoms;
                renderAtoms(allAtoms);

            } catch (err) {
                console.error('Failed to load results:', err);
                document.getElementById('loading').innerHTML = `
                    <p class="text-red-600">Failed to load results: ${err.message}</p>
                    <a href="/upload.html" class="text-indigo-600 hover:underline mt-4 inline-block">Upload New Content</a>
                `;
            }
        }

        loadResults();
    </script>
</body>
</html>
